
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #11111b;
  color: #eeeaf7;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #1c1a2b;
  border-bottom: 1px solid #39334e;
  text-align: center;
}
header h1 {
  margin: 0;
  color: #c5a7ff;
}
header p { color: #aaa0bd; font-size: 13px; }
main {
  max-width: 850px;
  margin: auto;
  padding: 16px;
}
.panel {
  background: #201e30;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 14px;
}
label {
  display: block;
  margin-bottom: 8px;
  color: #c5a7ff;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #49415f;
  background: #151421;
  color: white;
  font-size: 15px;
  margin-bottom: 12px;
}
#chat {
  height: 48vh;
  min-height: 260px;
  overflow-y: auto;
  padding: 12px;
  background: #171624;
  border-radius: 12px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.user { background: #40345f; margin-left: 12%; }
.bot { background: #29263b; margin-right: 12%; }
.name {
  color: #c5a7ff;
  font-size: 12px;
  margin-bottom: 5px;
}
button {
  border: 0;
  padding: 13px 18px;
  border-radius: 10px;
  background: #9874d9;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
button:disabled { opacity: .5; }
.send {
  width: 100%;
  margin-top: 4px;
}
#status {
  color: #aaa0bd;
  font-size: 13px;
  margin: 10px 0;
}
</style>
</head>
<body>

<header>
  <h1>☾ Luna AI</h1>
  <p>Твой ИИ-собеседник и мир историй</p>
</header>

<main>
  <section class="panel">
    <label for="character">Описание персонажа</label>
    <textarea id="character" rows="3"
      placeholder="Имя, характер, внешность, история..."></textarea>
    <button onclick="clearChat()">Новый диалог</button>
  </section>

  <section class="panel">
    <div id="chat">
      <div class="message bot">
        <div class="name">Luna</div>
        Привет! Я Луна. О чём поговорим сегодня?
      </div>
    </div>

    <div id="status">Подключение не проверено</div>

    <label for="message">Твоё сообщение</label>
    <textarea id="message" rows="3"
      placeholder="Напиши сообщение..."></textarea>
    <button class="send" id="send" onclick="sendMessage()">
      Отправить
    </button>
  </section>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

let messages = [];

function addMessage(role, content) {
  const item = document.createElement("div");
  item.className = "message " +
    (role === "user" ? "user" : "bot");

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = role === "user" ? "Ты" : "Luna";

  const text = document.createElement("div");
  text.textContent = content;

  item.append(name, text);
  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

async function checkServer() {
  try {
    const response = await fetch("/api/status");
    if (!response.ok) throw new Error();
    statusText.textContent = "● Сервер Luna работает";
  } catch {
    statusText.textContent = "○ Сервер пока недоступен";
  }
}

async function sendMessage() {
  const content = input.value.trim();
  if (!content || sendButton.disabled) return;

  const previousMessages = [...messages];

  messages.push({ role: "user", content });
  addMessage("user", content);
  input.value = "";
  sendButton.disabled = true;
  statusText.textContent = "Luna печатает...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: messages,
        character: document.getElementById("character").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    if (!data.reply) throw new Error("Пустой ответ");

    messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage("assistant", data.reply);
    statusText.textContent = "● Luna ответила";

  } catch (error) {
    messages = previousMessages;
    addMessage("assistant",
      "Не удалось получить ответ: " + error.message);
    statusText.textContent = "Ошибка подключения";
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
}

function clearChat() {
  messages = [];
  chat.replaceChildren();
  addMessage("assistant", "Новый диалог начат. Я готова!");
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

checkServer();
</script>
</body>
  </html>
